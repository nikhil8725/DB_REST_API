name: CI Pipeline & Banking Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-quality:
    name: Code Linting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Run Ruff Linter
        run: ruff check app/ tests/

      - name: Run Bandit SAST Security Scan
        run: bandit -r app -ll -ii

  regression-tests:
    name: Automated Regression Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Regression Suite with Coverage Gate
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security-compliance:
    name: Banking Compliance & Vulnerability Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. Secret Scanning (Zero Credentials in Git)
      - name: Gitleaks Secret Audit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. OpenSSF Python Dependency CVE Scan
      - name: Run pip-audit for Known Vulnerabilities
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
          pip-audit --desc on

      # 3. Aqua Trivy Vulnerability Gate (Fails build on Critical/Blocker)
      - name: Run Aqua Trivy (Critical Vulnerability Gate)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      # 4. Generate Standardized CycloneDX SBOM (DORA / EO 14028 Compliance)
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "cyclonedx"
          output: "sbom-cyclonedx.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
